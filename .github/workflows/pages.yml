name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: |
          npm run check
          npm test
          npm run catalogue:links

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Aggregate successful-print evidence
        run: npm run evidence:build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRINT_EVIDENCE_OUTPUT: temp/print-evidence.json

      - name: Build web app
        run: npm run build
        env:
          VITE_BASE_PATH: /opentlp/studio/
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Add successful-print evidence to Studio
        run: cp temp/print-evidence.json apps/web-app/dist/print-evidence.json

      - name: Build ULT documentation
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./packages/ult
          destination: ./packages/ult/_site

      - name: Assemble the OpenTLP Pages site
        run: |
          mkdir -p apps/web-app/pages/studio/ult
          cp -R apps/web-app/dist/. apps/web-app/pages/studio/
          cp -R packages/ult/_site/. apps/web-app/pages/studio/ult/
          cp apps/web-app/pages-index.html apps/web-app/pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web-app/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
